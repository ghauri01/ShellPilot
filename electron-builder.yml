appId: com.shellpilot.app
productName: ShellPilot
copyright: Copyright © 2026 ShellPilot contributors

publish:
  provider: github
  owner: ghauri01
  repo: ShellPilot

directories:
  buildResources: build
  output: release

files:
  - out/**
  - bin/**
  - resources/**
  # The tunnel engines are shipped through extraResources instead, so a build
  # carries only the binaries for the platform it targets. Bundling all six
  # cross-compiled targets in every artifact would add tens of megabytes of
  # binaries the machine can never execute.
  - '!resources/bin/**'
  # node-pty's Windows prebuild ships a redistributable ConPTY — conpty.dll and
  # OpenConsole.exe — that this app never loads: localPty.ts sets
  # useConptyDll: false, so the ConPTY in the system's own conhost.exe is used
  # instead. Shipping unsigned Microsoft binaries we do not use through an
  # installer is precisely what the Defender and ClamAV hard-fail gates in the
  # release workflow are there to catch.
  #
  # Two things about the shape of this pattern:
  #
  #   * It ends at the `conpty/` DIRECTORY. conpty.node and
  #     conpty_console_list.node — the actual bindings — sit one level up as
  #     files, so they survive. A `conpty*` pattern would take them out and
  #     break Windows entirely.
  #   * It is scoped to @lydell/node-pty-*. `prebuilds/` is a prebuildify
  #     convention, not a node-pty invention, so an unscoped
  #     '!**/prebuilds/**/conpty/**' would silently strip files out of any
  #     future dependency that happens to lay itself out the same way.
  #
  # There is deliberately no '!**/prebuilds/**/*.pdb' beside this:
  # electron-builder already drops *.pdb from node_modules unless includePdb is
  # set (appFileCopier.js:128-132), so that pattern is a no-op that reads like a
  # protection. tests/localPackaging.test.ts asserts the flag stays unset
  # instead.
  #   * The middle segment is `*/`, not `**/`, and that is load-bearing. With a
  #     leading `**/` already in the pattern, a second `**/` in the middle makes
  #     minimatch match nothing at all — the scoped form written with `**/`
  #     silently excluded no files and shipped conpty.dll and OpenConsole.exe
  #     into the first 0.8.0 Windows build. `prebuilds/*/conpty/` is one
  #     platform-arch directory, which is exactly the shape here.
  - '!**/node_modules/@lydell/node-pty-*/prebuilds/*/conpty/**'
  - package.json

# Tunnel engines: shellpilot-netd (our WireGuard sidecar, MIT), frpc
# (Apache-2.0), openvpn (GPL-2.0, macOS and Linux only) and wintun.dll
# (proprietary, Windows only — see THIRD-PARTY-NOTICES.md). Built or fetched by
# scripts/{build-sidecar,build-frpc,build-openvpn,fetch-wintun} before
# electron-builder runs; CI must do that or the app ships with no engines and
# every VPN profile reports binary-missing.
#
# The `filter: **/*` below is what carries wintun.dll: the directory is copied
# whole rather than by a list of executable names, and the DLL has to land in
# the same directory as shellpilot-netd.exe to be found at all.
#
# ${platform}-${arch} expands to Node's own names (darwin-arm64, win32-x64,
# ...), which is exactly what process.platform/process.arch produce at
# runtime — so the lookup path is identical in a dev checkout and in a
# packaged app, and there is no per-environment special case to get wrong.
extraResources:
  - from: resources/bin/${platform}-${arch}
    to: bin/${platform}-${arch}
    filter: ['**/*']
  - from: resources/bin/manifest.json
    to: bin/manifest.json

# ssh2 pulls in an optional native crypto binding; keep it unpacked so it can
# be dlopen'd from outside the asar archive. bin/ (shellpilot.cmd|.sh) and
# out/cli (what they invoke) are the `shellpilot` CLI launcher — cmd.exe/a
# shell can't execute a script or load a module from inside an asar archive
# at all, so both must stay unpacked, real files on disk.
asarUnpack:
  - '**/node_modules/cpu-features/**'
  - '**/node_modules/ssh2/**'
  # The whole package directory, deliberately not a '*.node' glob.
  #
  # node-pty is not only a loadable binding: on macOS and Linux it ships
  # `spawn-helper`, a Mach-O/ELF *executable* it fork/execs for every session.
  # lib/unixTerminal.js:31-34 builds that helper's path from __dirname and
  # rewrites `app.asar` to `app.asar.unpacked` in it — which only helps if the
  # file is actually there. A glob matching only .node files leaves the helper
  # inside the archive, where it has no path on disk to hand to posix_spawn and
  # every spawn fails with ENOENT. Unpacking the directory at build time is also
  # what preserves its +x bit; asar's runtime extraction does not.
  #
  # The second pattern is the load-bearing one. @lydell/node-pty is a 13.5 KB,
  # five-file meta package with no binary in it at all: its index.js does
  # require(`@lydell/node-pty-${process.platform}-${process.arch}`), and that
  # sibling package is where prebuilds/<platform>-<arch>/pty.node and
  # spawn-helper live. Unpacking only the meta package unpacks nothing that
  # matters.
  #
  # They are two patterns because one cannot cover both: minimatch compares
  # whole path segments, so '@lydell/node-pty/**' does not match
  # '@lydell/node-pty-darwin-arm64/...'. Verified against minimatch with
  # electron-builder's own {dot: true} options.
  - '**/node_modules/@lydell/node-pty/**'
  - '**/node_modules/@lydell/node-pty-*/**'
  - 'out/cli/**'
  - 'bin/**'

win:
  icon: build/icon.ico
  target:
    # Installer with Start-menu and desktop shortcuts.
    - target: nsis
      arch: [x64]
    # Single self-contained .exe — no install, runs from a USB stick.
    - target: portable
      arch: [x64]

# Named per target: ${target} is not a valid artifactName macro, so the two
# Windows outputs are distinguished in their own sections instead.
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ShellPilot
  # Adds the CLI launcher's folder to the user's PATH on install — see the
  # script itself for why it deliberately does not undo that on uninstall.
  include: build/installer.nsh

portable:
  artifactName: ${productName}-${version}-portable.${ext}
  # Keep settings/vault next to the exe rather than in the Windows profile, so
  # the whole thing really is portable.
  unpackDirName: ShellPilot

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # There is no Apple Developer ID certificate for this project, and with no
  # identity electron-builder skips signing altogether — which leaves Electron's
  # own linker-signed ad-hoc signature on the bundle, covering none of the files
  # we added. Gatekeeper reads that mismatch as corruption and reports the app as
  # "damaged", a dialog with no Open Anyway button. Signing ad-hoc ourselves seals
  # the real bundle, so the app fails the ordinary "cannot be verified" way that
  # users can click through. It is still not notarized.
  # When a Developer ID certificate is available, this whole block becomes:
  #
  #   identity: 'Developer ID Application: <NAME> (<TEAM_ID>)'
  #   hardenedRuntime: true
  #   entitlements: build/entitlements.mac.plist
  #   entitlementsInherit: build/entitlements.mac.plist
  #   notarize: true          # plus APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID in CI
  #
  # That one change removes the Gatekeeper warning entirely, and it is also what
  # unlocks hardened runtime (see below), a stable signing identity so keychain
  # ACLs survive updates, and the data-protection keychain that biometry ACLs
  # and Secure Enclave keys require. build/entitlements.mac.plist is already
  # written and carries the library-validation exception the unpacked ssh2 and
  # cpu-features binaries need.
  identity: '-'
  # On, despite there being no Developer ID. The hardened runtime blocks
  # DYLD_INSERT_LIBRARIES injection and debugger attach regardless of
  # notarization, and without it a process running as the same user can inject
  # into ShellPilot and read an unlocked vault key straight out of memory —
  # which defeats every protection the vault has, biometrics included.
  #
  # The entitlements plist disables library validation, because asarUnpack
  # deliberately keeps the ssh2 and cpu-features .node binaries outside the
  # archive. That gives back one of the three protections and keeps the two
  # that matter here.
  #
  # Verified before enabling, on an ad-hoc signed arm64 build: signs cleanly
  # (adhoc,runtime, 132 sealed files, codesign --verify --strict passes), the
  # app launches with its renderer and helpers, and an ssh2 connection to a
  # real host completes. The native crypto binding does not load — but it does
  # not load without the hardened runtime either, and ssh2 falls back to pure
  # JS, so SSH is unaffected.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # macOS TCC prompt copy for the local terminal.
  #
  # On macOS 10.15+ the first access to ~/Documents, ~/Desktop, ~/Downloads or a
  # removable volume by any process inside this bundle — the shell the user just
  # opened very much included — raises a consent prompt, and these strings are
  # its body text.
  #
  # They are OPTIONAL for the Files-and-Folders class: without them the system
  # supplies generic copy, and a denial surfaces as EPERM ("Operation not
  # permitted"), not a crash. (Termination on a missing usage description is
  # real, but for the hardware and personal-data classes — Camera, Contacts,
  # Photos — not this one. Terminal.app declares none of these keys.) They are
  # set because a dialog that explains why a terminal wants your Downloads
  # folder gets approved, and a generic one gets declined. The child shell
  # inherits the app bundle's TCC identity, so the strings belong here and
  # nowhere in the child's environment.
  #
  # The cost specific to this app: with `identity: '-'` there is no Team ID for
  # TCC to key the grant on, so it falls back to the ad-hoc cdhash — which
  # changes on every build. Every release therefore re-prompts, for all four.
  # Same root cause as the keychain-ACL note above, and another entry on the
  # Developer ID case.
  extendInfo:
    NSDocumentsFolderUsageDescription: >-
      ShellPilot needs access to your Documents folder so that commands you run
      in a local terminal can read and write files there.
    NSDesktopFolderUsageDescription: >-
      ShellPilot needs access to your Desktop so that commands you run in a
      local terminal can read and write files there.
    NSDownloadsFolderUsageDescription: >-
      ShellPilot needs access to your Downloads folder so that commands you run
      in a local terminal can read and write files there.
    NSRemovableVolumesUsageDescription: >-
      ShellPilot needs access to removable volumes so that commands you run in a
      local terminal can read and write files on external drives.
  # The tunnel engines under Resources/bin are Mach-O executables and arm64
  # macOS refuses to run an unsigned one at all. electron-builder discovers and
  # signs nested binaries, and they are spawned as separate processes rather
  # than dlopen'd, so library validation does not apply to them the way it does
  # to the ssh2 bindings. `codesign --verify --strict --deep` on the packaged
  # .app is the check that this stayed true — it is in the release workflow.
  # Both mac architectures come out of ONE job, ONE npm ci and ONE
  # electron-builder run, and electron-builder copies the same node_modules into
  # both bundles. That is fine for pure JS and for the engines (extraResources
  # picks resources/bin/${platform}-${arch} per bundle), but it is not fine for a
  # dependency npm installs per-architecture: @lydell/node-pty-* declares
  # "os"/"cpu", so a plain `npm ci` on the arm64 runner installs the arm64
  # sibling only and the x64 dmg would ship a binding it cannot load.
  #
  # The release workflow force-installs both siblings before packaging — see
  # "Install both macOS node-pty prebuilds" in .github/workflows/release.yml,
  # which also records why that beats splitting this into a per-arch build.
  # Anyone building an x64 dmg by hand needs the same step.
  target:
    - target: dmg
      arch: [x64, arm64]

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  category: Development
  maintainer: ghauri01 <aliwaqarofficial@gmail.com>
  synopsis: Your DevOps workstation, everywhere.
  description: >-
    Free, open-source SSH client, SFTP browser, SSH tunnel manager, multi-engine
    database GUI and encrypted secrets vault in one desktop app. An open
    alternative to MobaXterm, PuTTY and Termius.
  desktop:
    entry:
      Name: ShellPilot
      Comment: SSH, SFTP, tunnels and databases in one place
      Categories: Development;Utility;
      Terminal: 'false'
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
