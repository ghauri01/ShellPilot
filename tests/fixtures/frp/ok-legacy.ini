# frpc.ini from frp 0.4x
[common]
server_addr = frp.example.com
server_port = 7000
token = s3cr3t-token
protocol = kcp
pool_count = 5
heartbeat_interval = 30
log_file = ./frpc.log
log_level = info
admin_addr = 127.0.0.1
admin_port = 7400

[ssh]
type = tcp
local_ip = 127.0.0.1
local_port = 22
remote_port = 6000

[web]
type = http
local_port = 8080
custom_domains = web.example.com, www.example.com
use_compression = true

[secret_ssh]
type = stcp
sk = peer-shared-secret
local_port = 22

[secret_ssh_visitor]
type = stcp
role = visitor
server_name = secret_ssh
sk = peer-shared-secret
bind_addr = 127.0.0.1
bind_port = 6000
