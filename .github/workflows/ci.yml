name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Route installs through the Chainsaw proxy. The heredoc is deliberately
      # unquoted: <<'EOF' would write the literal ${CHAINSAW_CLIENT_ID} into
      # .npmrc rather than the secret, and authentication would fail. The file
      # is generated here and git-ignored, so no credential is ever committed.
      - name: Configure npm registry for Chainsaw
        shell: bash
        env:
          CHAINSAW_CLIENT_ID: ${{ secrets.CHAINSAW_CLIENT_ID }}
          CHAINSAW_CLIENT_SECRET: ${{ secrets.CHAINSAW_CLIENT_SECRET }}
        run: |
          cat > .npmrc <<EOF
          registry=https://chain305.com/chainproxy/repository/@shellpilot/npmjs/
          //chain305.com/chainproxy/repository/@shellpilot/npmjs/:_authToken=${CHAINSAW_CLIENT_ID}:${CHAINSAW_CLIENT_SECRET}
          always-auth=true
          EOF

      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm run build
