name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: sidecar/netd/go.sum
      - run: npm ci
      # `npm audit`, with the registry's own flakiness separated from a finding.
      #
      # The audit endpoint returned 503 three times in one afternoon during the
      # 0.13.x releases, each time marking main red for a reason that had
      # nothing to do with this repository. Two obvious fixes are both wrong:
      # `continue-on-error` would let a real vulnerability through silently, and
      # leaving it bare means a third-party outage blocks unrelated work.
      #
      # So the two cases are told apart. A vulnerability fails the build, as it
      # always did. An unreachable endpoint retries, and if it is still
      # unreachable it says "not checked" loudly -- in the log and in the job
      # summary -- rather than reporting a green nobody earned. "We could not
      # look" is a third answer, and pretending it is either of the other two is
      # the same mistake this codebase refuses everywhere else.
      - name: npm audit
        run: |
          for attempt in 1 2 3; do
            out=$(npm audit 2>&1) && { echo "$out"; exit 0; }
            if echo "$out" | grep -qiE 'audit endpoint returned an error|Service Unavailable|ECONNRESET|ETIMEDOUT'; then
              echo "::warning::npm audit could not reach the registry (attempt $attempt/3), retrying"
              sleep $((attempt * 20))
              continue
            fi
            # Reached the registry and it had something to say. That is a finding.
            echo "$out"
            exit 1
          done
          echo "::warning::npm audit NOT RUN -- the registry was unreachable for all 3 attempts. Dependencies are unverified for this run."
          echo '### :warning: npm audit did not run' >> "$GITHUB_STEP_SUMMARY"
          echo 'The npm advisory endpoint was unreachable for all three attempts, so dependencies are **unverified for this run** -- this is not a clean audit.' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # The WireGuard sidecar is a Go program in this repo, so it is covered by
      # CI like the TypeScript is. Building it here also proves the six-target
      # cross-compile still works before a release depends on it.
      #
      # This runs *before* `npm run test`: the driver's integration tests drive
      # the real binary, and on a clean runner it does not exist until this step
      # has produced it.
      - name: Sidecar vet and test
        working-directory: sidecar/netd
        run: |
          go vet ./...
          go test ./...
      - name: Sidecar cross-compile
        run: npm run build:sidecar
      # The engine build scripts only ever run in the release workflow, so a
      # typo in one of them is discovered by a failed release. A parse check
      # costs a second and catches the whole class. It is not a substitute for
      # running them — building OpenSSL and OpenVPN from source would add a
      # quarter of an hour to every pull request, which is why the release
      # workflow is where that happens.
      - name: Engine build scripts parse
        run: bash -n scripts/lib/net-retry.sh scripts/build-openvpn.sh scripts/fetch-wintun.sh scripts/build-frpc.sh scripts/build-sidecar.sh
      - run: npm run test
      # tests/historyCapability.test.ts guards the one risk the node:sqlite
      # decision carries: the SQLite version is whatever Electron bundles and
      # nothing in package.json pins it. Under `npm test` that file runs in the
      # runner's Node, where an Electron bump changes nothing about what it
      # executes — it would stay green through the exact regression it exists to
      # catch. This runs the same file inside Electron's bundled Node
      # (ELECTRON_RUN_AS_NODE, no display needed), which is the runtime that
      # ships.
      - name: Capability guard under Electron's Node
        run: npm run test:capability

  # CI has always been ubuntu-only and has never run electron-builder, so
  # nothing here proved that a PACKAGED app could load a native module or exec a
  # helper binary — until this job the first test of that was a release tag. A
  # native dependency makes the gap load-bearing: @lydell/node-pty resolves its
  # binding out of a sibling package and fork/execs a `spawn-helper` that needs a
  # real path on disk, and both of those depend entirely on asarUnpack having
  # done its job. So this packs on all three runners and asserts the layout the
  # app depends on at runtime.
  #
  # It does NOT launch Electron. See docs/plans/local-terminal-plan.md,
  # "Testing strategy", for what that leaves unverified and why.
  pack:
    name: Pack ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # electron-builder's isSignAllowed() (macCodeSign.js:21) returns false as
      # soon as GITHUB_BASE_REF is set, which it always is on a pull request.
      # Without this the .app packed on a PR is unsigned while the one packed on
      # main is signed — one job producing two different artifacts, with the
      # signing-shaped failures visible only after merge. The usual objection to
      # CSC_FOR_PULL_REQUEST is that it exposes signing secrets to fork PRs;
      # there are none here to expose. `identity: '-'` is ad-hoc signing, which
      # needs no certificate and no keychain.
      CSC_FOR_PULL_REQUEST: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The tunnel engines are not built here: extraResources' `from`
      # directories are simply absent, which electron-builder warns about and
      # continues past (fileMatcher.js:271-275). This job is about the asar
      # layout, not the engines — scripts/verify-bin-manifest.mjs in the release
      # workflow covers those.
      - run: npx electron-builder --dir --publish never
      - run: node scripts/verify-local-pty-pack.mjs release
      # Proves the prebuilt binding loads and, on POSIX, that spawn-helper
      # actually execs under plain Node on this OS. Node-API is what makes that
      # transferable to Electron; a NAN/V8 module could not be checked this way
      # at all.
      - run: npx vitest run tests/localPtySmoke.test.ts

      # Q3, and the only place it can honestly be answered.
      #
      # The shipped Windows build excludes node-pty's redistributable ConPTY --
      # conpty.dll and OpenConsole.exe -- on the assumption that the system
      # ConPTY in conhost.exe is used instead (localPty.ts sets
      # useConptyDll: false). Nothing proved that. The smoke test above runs
      # against node_modules, where the directory is still present, so it
      # exercises the opposite of the condition that ships.
      #
      # So: delete the directory and spawn again. This is the packed app's
      # situation reproduced in a place where a failure is cheap.
      #
      # It fails hard when the directory is absent rather than shrugging. A step
      # that silently passes because it found nothing to remove is how the
      # conpty exclusion pattern shipped broken in the first place -- the test
      # that was meant to catch it asserted a pattern string and never ran the
      # glob.
      - name: Verify ConPTY works without the bundled redistributable (Q3)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dirs = @(Get-ChildItem -Path node_modules/@lydell -Recurse -Directory -Filter conpty -ErrorAction SilentlyContinue)
          if ($dirs.Count -eq 0) {
            Write-Host "::error::No conpty/ directory found under node_modules/@lydell. Either the package layout changed or an earlier step removed it -- either way this step is no longer testing what it claims."
            exit 1
          }
          foreach ($d in $dirs) {
            Write-Host "Removing $($d.FullName)"
            Remove-Item -LiteralPath $d.FullName -Recurse -Force
          }
          Write-Host "Spawning through ConPTY with no redistributable present..."
          npx vitest run tests/localPtySmoke.test.ts
