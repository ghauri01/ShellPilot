name: Release

# Build ShellPilot for Windows, macOS and Linux whenever a version tag is
# pushed, then attach every installer to the matching GitHub release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Re-pushing a tag, or two tags in quick succession, would otherwise run two
# release jobs editing the same release body at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
            # One job builds both dmgs from one node_modules, so the packed
            # bundles must carry both architectures' node-pty prebuilds — see
            # "Install both macOS node-pty prebuilds" below.
            packArgs: --arch x64 --arch arm64
          - os: ubuntu-latest
            script: dist:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # electron-builder takes the artifact version from package.json, while
      # the release notes take it from the tag. If they disagree every download
      # link 404s, so stop here rather than publishing a broken release.
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json $PKG. Bump the version, commit, then re-tag."
            exit 1
          fi

      # The WireGuard sidecar and the frp client are Go programs built from
      # source into resources/bin, and OpenVPN is a C program built the same
      # way. electron-builder pulls them in through extraResources, and a
      # missing build is silent at package time — it only surfaces at runtime
      # as "binary-missing" on every tunnel. So this step runs before the
      # build, and the verification step below fails the release rather than
      # shipping an app with no engines.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: sidecar/netd/go.sum

      # OpenVPN is autotools, and it is built from a git checkout rather than a
      # release tarball, so the generated `configure` does not exist yet and
      # autoreconf has to make one. Windows needs none of this: it does not
      # bundle OpenVPN, and build-openvpn.sh exits cleanly there.
      - name: Install the OpenVPN build toolchain (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install autoconf automake libtool

      - name: Install the OpenVPN build toolchain (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq autoconf automake libtool pkg-config libcap-ng-dev

      - name: Build tunnel engines
        shell: bash
        run: npm run build:engines

      # GPL-2.0 §3. We distribute OpenVPN binaries, so we owe the corresponding
      # source, and an offer nobody can act on is not compliance. This is the
      # exact tree the step above compiled — `git archive` of the pinned
      # commit — uploaded here and attached to the release beside the
      # installers, with its SHA-256 in the checksum table.
      #
      # Only from the Linux job: all three build the same tag from the same
      # commit, so three identical uploads would collide at merge time for no
      # gain.
      - name: Upload OpenVPN corresponding source
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-source
          path: .openvpn-src/*.tar.gz
          if-no-files-found: error
          # The directory starts with a dot, and upload-artifact skips hidden
          # paths by default — so the tarball was written, found by nobody, and
          # the release failed on a file that existed. This is the GPL-2.0 §3
          # corresponding source, so it is not optional.
          include-hidden-files: true

      - name: Verify engine manifest covers this platform
        shell: bash
        run: node scripts/verify-bin-manifest.mjs

      - run: npm ci

      - run: npm run typecheck

      # electron-builder packs ONE node_modules into BOTH macOS bundles, and
      # @lydell/node-pty's prebuilds do not live in the package npm resolves —
      # they live in per-platform siblings (@lydell/node-pty-darwin-x64 and
      # -darwin-arm64) that declare "os"/"cpu". So `npm ci` on this arm64 runner
      # installs exactly one of them, electron-builder copies that one tree into
      # the x64 dmg as well, and every Intel Mac gets MODULE_NOT_FOUND the first
      # time it opens a local tab. Nothing catches it: a --dir pack covers the
      # host arch only, and the signature check below reads whichever .app it
      # walks first.
      #
      # `--force` is what gets past npm's EBADPLATFORM for the sibling that does
      # not match this runner. It is scoped to these two package names; --os /
      # --cpu are NOT used, because they apply to the whole reify and would swap
      # esbuild and rollup — which are also cpu-gated — to the wrong
      # architecture for the machine that has to run them.
      #
      # The alternative was splitting this into a per-arch matrix with a
      # target-arch `npm ci` before each electron-builder run. Rejected: each
      # run writes its own latest-mac.yml listing only its own dmg, so the two
      # jobs would race and the loser's architecture would be handed the other's
      # download by every auto-update check. That is a worse bug than 1 MB of
      # unused prebuild in each dmg, and it is one nobody would notice for a
      # release or two.
      - name: Install both macOS node-pty prebuilds
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d node_modules/@lydell/node-pty ]; then
            echo "@lydell/node-pty is not installed for this build; nothing to do."
            exit 0
          fi
          VER=$(node -p "require('./node_modules/@lydell/node-pty/package.json').version")
          echo "pinning both darwin prebuilds to $VER"
          npm i --no-save --force "@lydell/node-pty-darwin-x64@$VER" "@lydell/node-pty-darwin-arm64@$VER"
          for arch in x64 arm64; do
            dir="node_modules/@lydell/node-pty-darwin-$arch/prebuilds/darwin-$arch"
            if [ ! -f "$dir/pty.node" ]; then
              echo "::error::$dir/pty.node is missing; the x64 dmg would ship an arm64 binding"
              exit 1
            fi
          done

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same layout assertions the pack job runs on every pull request, now
      # against the artifacts that are actually about to be published — and on
      # macOS against both architectures, which is the one thing a pull request
      # cannot check from a single-arch runner.
      - name: Verify the packed node-pty layout
        shell: bash
        run: node scripts/verify-local-pty-pack.mjs release ${{ matrix.packArgs }}

      # The engines are Mach-O executables under Resources/bin and arm64 macOS
      # refuses to run an unsigned one at all. electron-builder signs nested
      # binaries, but that is exactly the kind of thing that quietly stops
      # being true after a config change, so assert it here.
      - name: Verify macOS signature covers the engines
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          # EVERY .app, not `head -n1`. This job produces two bundles — x64 and
          # arm64 — and they are not built from the same inputs: each takes its
          # engines from its own resources/bin/darwin-<arch>. Checking one and
          # reporting on both is how an unsigned or missing binary ships.
          APPS=$(find release -maxdepth 3 -name '*.app' -type d)
          if [ -z "$APPS" ]; then echo "::error::no .app found under release/"; exit 1; fi
          # Only assert on node-pty in a build that has it, so this step stays
          # correct if the dependency is ever rolled back.
          if [ -d node_modules/@lydell/node-pty ]; then PTY=1; else PTY=0; fi
          while IFS= read -r APP; do
            [ -n "$APP" ] || continue
            echo "verifying $APP"
            codesign --verify --strict --deep --verbose=2 "$APP"
            for bin in "$APP/Contents/Resources/bin"/*/*; do
              [ -f "$bin" ] || continue
              echo "checking $bin"
              codesign --verify --strict "$bin"
            done

            # node-pty's binding and its spawn-helper live outside the asar
            # (asarUnpack), so a config change that stops unpacking them is
            # invisible until the first local tab dies on a user's machine.
            #
            # This counts. The obvious form — `[ -d .../@lydell ] || exit 1` —
            # passes as soon as the 13.5 KB meta package is copied, which
            # happens whether or not the sibling that holds the actual binary
            # was unpacked; `find` would then match nothing, the loop body would
            # never run, and the release would go green with a binding-less app.
            #
            # What is deliberately NOT asserted here is `codesign --verify` on
            # each of these files. They arrive from npm already adhoc,
            # linker-signed, so that check passes no matter what we do to them
            # and proves nothing. The --deep verification of the whole bundle
            # above is the assertion with teeth: it fails if anything under
            # Contents/ is not covered by the seal.
            if [ "$PTY" -eq 0 ]; then continue; fi
            UNPACKED="$APP/Contents/Resources/app.asar.unpacked/node_modules/@lydell"
            if [ ! -d "$UNPACKED" ]; then
              echo "::error::@lydell/node-pty is not unpacked in $APP"; exit 1
            fi
            COUNT=$(find "$UNPACKED" \( -name 'pty.node' -o -name 'spawn-helper' \) | wc -l | tr -d ' ')
            echo "$APP: $COUNT unpacked node-pty binaries"
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::no pty.node or spawn-helper under $UNPACKED — the prebuild sibling was not unpacked"
              exit 1
            fi
          done <<< "$APPS"

      # Defender is already installed on the Windows runner, so scanning the
      # installers we just produced costs nothing and catches a problem before
      # anything is published rather than after someone downloads it.
      - name: Scan installers with Microsoft Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) {
            Write-Warning "Defender not present on this runner"
            "not available on this runner" | Out-File -Encoding utf8 release/_defender.txt
            exit 0
          }
          & $mp -SignatureUpdate | Out-Null
          $bad = 0
          Get-ChildItem release -Include *.exe -Recurse | ForEach-Object {
            Write-Host "Scanning $($_.Name)"
            & $mp -Scan -ScanType 3 -File $_.FullName -DisableRemediation
            # 0 = no threat, 2 = threat found
            if ($LASTEXITCODE -eq 2) { Write-Error "Defender flagged $($_.Name)"; $bad = 1 }
          }
          if ($bad -eq 0) { "no threats found" | Out-File -Encoding utf8 release/_defender.txt }
          exit $bad

      - uses: actions/upload-artifact@v4
        with:
          name: shellpilot-${{ matrix.os }}
          # The latest*.yml / beta*.yml entries are the channel manifests
          # electron-updater reads to decide whether an update exists at all —
          # one per platform, named by electron-builder from the version's
          # semver prerelease component. Until they were listed here they
          # reached the release only as a side effect of electron-builder's own
          # default publish policy, which is a great deal of trust to place in
          # a default for the one file the entire update mechanism depends on.
          # Listing them puts them through the same upload, download and
          # verified release step every installer already goes through.
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/beta*.yml
            release/_defender.txt
          # A silent no-op here would publish a release whose notes link to
          # files that were never built.
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # gh probes local git state even for a fully-qualified repos/OWNER/REPO
      # api call — without this, the job's workspace isn't a git repository at
      # all (no other step here needs source, only the download below), and
      # `gh api .../generate-notes` fails with "not a git repository" before
      # release notes can be published.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The builds are unsigned, so independent scans are the only reassurance a
      # downloader gets. ClamAV needs no account and runs entirely in the job,
      # so it always runs; VirusTotal needs a free API key and is skipped rather
      # than failed when one is not configured, so a fork can still cut a release.
      - name: Scan installers with ClamAV
        id: clamav
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --quiet || echo "::warning::freshclam could not update; using shipped signatures"
          VER=$(clamscan --version)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # The installers are 100 MB+, well past clamscan's 25 MB default caps.
          set +e
          clamscan --recursive --infected --no-summary \
                   --max-filesize=1024M --max-scansize=1024M \
                   artifacts | tee clamav.txt
          CODE=${PIPESTATUS[0]}
          set -e
          echo "engine: $VER"
          case "$CODE" in
            0) echo "status=clean"     >> "$GITHUB_OUTPUT" ;;
            1) echo "status=INFECTED"  >> "$GITHUB_OUTPUT"
               echo "::error::ClamAV reported an infected file"; exit 1 ;;
            *) echo "status=error"     >> "$GITHUB_OUTPUT"
               echo "::warning::ClamAV exited $CODE" ;;
          esac

      - name: Scan installers with VirusTotal
        id: virustotal
        if: env.VT_API_KEY != ''
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb

      # GitHub lists release assets as one flat block, so the platform
      # grouping has to live in the notes. Built here rather than kept as a
      # static file because every link carries the version.
      - name: Build release notes
        env:
          TAG: ${{ github.ref_name }}
          VT_RESULTS: ${{ steps.virustotal.outputs.analysis }}
          CLAMAV_STATUS: ${{ steps.clamav.outputs.status }}
          CLAMAV_VERSION: ${{ steps.clamav.outputs.version }}
        run: |
          DEFENDER_STATUS=$(cat artifacts/_defender.txt 2>/dev/null | tr -d '\r\n' || true)
          DEFENDER_STATUS=${DEFENDER_STATUS:-not run}
          rm -f artifacts/_defender.txt          # marker only; never a release asset
          VERSION="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # download-artifact nests one directory per build job, so find rather
          # than a flat glob. The four installer types plus the OpenVPN source
          # tarball — .blockmap and the channel yml files are updater metadata
          # nobody downloads by hand.
          CHECKSUMS=$(cd artifacts && find . -type f \
              \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
                 -o -name 'openvpn-*-source.tar.gz' \) \
            | sort \
            | xargs -r sha256sum \
            | awk '{ name = $2; sub(/.*\//, "", name); printf "| `%s` | `%s` |\n", name, $1 }')
          {
            # FIRST, above the download links, and there is a test that keeps it
            # there. Buried at the bottom it was worse than absent: macOS tells
            # people the app is DAMAGED and offers them a Move to Trash button,
            # so a reader who has to scroll past every checksum table to learn
            # otherwise has already trashed it.
            echo "## First run"
            echo
            echo "These builds are not signed with a paid Apple or Microsoft certificate, so"
            echo "both systems stop you the first time. Neither message is a finding about"
            echo "this file — every installer's SHA-256 is under [Checksums](#checksums)."
            echo
            echo "**macOS — you will be told the app is \"damaged\".** It is not. macOS shows"
            echo "that exact wording for any app it cannot trace to a paid Apple Developer ID,"
            echo "and the dialog's only obvious button moves it to the Trash. Do not use it."
            echo "On macOS 15 (Sequoia) and later there is no right-click → Open bypass; Apple"
            echo "removed it. Drag the app to Applications, then either open"
            echo "**System Settings → Privacy & Security** and click **Open Anyway**, or run:"
            echo
            echo '```bash'
            echo "/usr/bin/xattr -dr com.apple.quarantine /Applications/ShellPilot.app"
            echo '```'
            echo
            echo "That clears the download flag and nothing else — the app's signature stays"
            echo "intact and verifiable with \`codesign --verify --strict --deep\`. The full"
            echo "path is deliberate: a Homebrew or pip \`xattr\` earlier on your PATH may not"
            echo "support \`-r\`."
            echo
            echo "**Windows — SmartScreen will warn.** Choose *More info → Run anyway*."
            echo
            echo "---"
            echo
            echo "## Downloads"
            echo
            echo "### Windows"
            echo
            echo "| File | Notes |"
            echo "|---|---|"
            echo "| [\`ShellPilot-${VERSION}-setup.exe\`]($BASE/ShellPilot-${VERSION}-setup.exe) | Installer with desktop and Start-menu shortcuts. **Pick this one if unsure.** |"
            echo "| [\`ShellPilot-${VERSION}-portable.exe\`]($BASE/ShellPilot-${VERSION}-portable.exe) | Single file, no install, keeps its data beside the \`.exe\` — runs from a USB stick |"
            echo
            echo "### macOS"
            echo
            echo "| File | Notes |"
            echo "|---|---|"
            echo "| [\`ShellPilot-${VERSION}-arm64.dmg\`]($BASE/ShellPilot-${VERSION}-arm64.dmg) | Apple Silicon (M1 and later) |"
            echo "| [\`ShellPilot-${VERSION}-x64.dmg\`]($BASE/ShellPilot-${VERSION}-x64.dmg) | Intel Macs |"
            echo
            echo "### Linux"
            echo
            echo "| File | Notes |"
            echo "|---|---|"
            echo "| [\`ShellPilot-${VERSION}-x86_64.AppImage\`]($BASE/ShellPilot-${VERSION}-x86_64.AppImage) | Any distribution — \`chmod +x\` and run |"
            echo "| [\`ShellPilot-${VERSION}-amd64.deb\`]($BASE/ShellPilot-${VERSION}-amd64.deb) | Debian and Ubuntu — \`sudo apt install ./ShellPilot-${VERSION}-amd64.deb\` |"
            echo
            echo "---"
            echo
            echo "### Source for the bundled OpenVPN"
            echo
            OVPN_SRC=$(cd artifacts && find . -name 'openvpn-*-source.tar.gz' -printf '%f\n' 2>/dev/null | head -n1)
            if [ -n "$OVPN_SRC" ]; then
              echo "ShellPilot bundles OpenVPN on macOS and Linux. OpenVPN is GPL-2.0, so the"
              echo "corresponding source for the exact build in these installers is published"
              echo "here as [\`$OVPN_SRC\`]($BASE/$OVPN_SRC) — the pinned upstream commit,"
              echo "unmodified, with its SHA-256 in the table below. \`scripts/build-openvpn.sh\`"
              echo "in this repository is the recipe that turns it into the shipped binary."
            else
              echo "**The OpenVPN source archive is missing from this release.** It should not be."
            fi
            echo
            echo "---"
            echo
            echo "### Antivirus scan"
            echo
            echo "These builds are unsigned, so every release is scanned before publishing."
            echo
            echo "| Scanner | Result |"
            echo "|---|---|"
            echo "| Microsoft Defender (Windows runner) | ${DEFENDER_STATUS:-no threats} |"
            echo "| ClamAV \`${CLAMAV_VERSION}\` | ${CLAMAV_STATUS:-clean} |"
            if [ -n "$VT_RESULTS" ]; then
              echo "| VirusTotal (70+ engines) | per-file reports below |"
            else
              echo "| VirusTotal (70+ engines) | not run for this release |"
            fi
            echo
            if [ -n "$VT_RESULTS" ]; then
              echo "$VT_RESULTS" | tr ',' '\n' | while IFS='=' read -r f url; do
                [ -n "$url" ] && echo "- [\`$(basename "$f")\`]($url)"
              done
              echo
            fi
            echo "One or two detections from minor engines are normal for an unsigned"
            echo "Electron installer. Verify the SHA-256 of what you downloaded against"
            echo "the value listed below, or build from source."
            echo
            echo "## Checksums"
            echo
            echo "These are the whole reason an unsigned build is still safe to trust: they"
            echo "prove the file you have is the file this workflow built. Check yours before"
            echo "running it."
            echo
            echo '```bash'
            echo "shasum -a 256 <file>                      # macOS, Linux"
            echo "certutil -hashfile <file> SHA256          # Windows"
            echo '```'
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            if [ -n "$CHECKSUMS" ]; then
              echo "$CHECKSUMS"
            else
              # Never silently claim an empty table is the checksum list.
              echo "| — | **Checksums could not be generated for this release.** |"
            fi
            echo
            echo "---"
            echo
            echo "The \`.blockmap\` files are build metadata, not downloads — they describe"
            echo "binary deltas between versions and are only read by an updater. The source"
            echo "archives are a snapshot of the repository, not a build."
            echo
          } > release-notes.md
          cat release-notes.md

      # Uploads the assets only. The notes are set in the next step instead,
      # because append_body silently did nothing here: when a release already
      # exists for the tag the action reuses it ("Using release N ... instead of
      # duplicate draft M") and the appended body never landed. Every release up
      # to and including v0.3.0 shipped with an empty body because of it —
      # downloads table, scan results, install guidance and all.
      - uses: softprops/action-gh-release@v2
        id: gh_release
        with:
          files: artifacts/**
          # Stays invisible until the notes are confirmed on the page. Assets
          # used to go public here and the body was set afterwards, so every
          # way the notes step could fail left a published, watcher-notified,
          # empty-bodied release — which the guard below could detect but not
          # undo. A draft sends no notifications and is not /releases/latest.
          draft: true

      # Set the body explicitly, then check it is actually there. A release
      # whose notes quietly vanish is worse than a failed job, because nothing
      # about the run looks wrong.
      - name: Publish release notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's own "What's Changed" section, kept below our notes rather
          # than lost to overwriting the body.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > generated.md || : > generated.md

          cp release-notes.md final-notes.md
          if [ -s generated.md ]; then
            { echo; echo "---"; echo; cat generated.md; } >> final-notes.md
          fi

          gh release edit "$TAG" --notes-file final-notes.md

          # Check what is actually on the page, not how long it is. A length
          # test passes on any body over the threshold, including one with none
          # of our content in it — so it could not detect the failure it was
          # written for. Every checksum and every download link must be there.
          gh release view "$TAG" --json body --jq '.body // ""' > remote.md

          grep -oE '[a-f0-9]{64}' final-notes.md | sort -u > expected.txt
          grep -oE 'https://github\.com/[^)]*/releases/download/[^)]+' final-notes.md | sort -u >> expected.txt

          if [ ! -s expected.txt ]; then
            echo "::error::The generated notes contain no checksums or download links at all."
            exit 1
          fi

          MISSING=0
          while IFS= read -r token; do
            [ -z "$token" ] && continue
            if ! grep -qF -- "$token" remote.md; then
              echo "::error::Missing from the published notes: $token"
              MISSING=1
            fi
          done < expected.txt

          if [ "$MISSING" -ne 0 ]; then
            echo "::error::The release is still a draft, so nothing is public. Fix and re-run."
            exit 1
          fi

          echo "Verified $(wc -l < expected.txt) checksums and links on the published page."

          # Confirmed on the page. Only now does anyone see it.
          #
          # Which update channel this release belongs to is decided here, and
          # getting it wrong is not cosmetic. Stable clients resolve updates
          # through /repos/:o/:r/releases/latest, which GitHub defines as the
          # newest release NOT marked prerelease — so a beta tag published as
          # latest is offered to every stable user on their next update check,
          # and there is no taking it back once they have downloaded it.
          #
          # The "Check tag matches package.json" step guarantees $TAG is "v"
          # plus the package.json version, so what follows the "v" is a semver
          # version and the only dash it can contain is the prerelease
          # separator: v0.7.0-beta.1 has one, v0.7.0 does not. That is the same
          # component electron-builder reads to name the channel file, so the
          # yml on the release and the flag on the release cannot disagree.
          VERSION="${TAG#v}"
          case "$VERSION" in
            *-*)
              # --latest=false is stated rather than merely omitted. Omitting
              # it leaves the flag at whatever GitHub or an earlier edit of
              # this release left there, and a prerelease still pinned as
              # latest is precisely the failure this branch exists to prevent.
              gh release edit "$TAG" --draft=false --prerelease --latest=false
              ;;
            *)
              gh release edit "$TAG" --draft=false --latest
              ;;
          esac
