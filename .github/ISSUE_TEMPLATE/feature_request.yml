name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
      description: Describe the situation, not only the solution you have in mind.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like instead?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried or considered
